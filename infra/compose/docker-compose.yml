services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lyonix
      POSTGRES_USER: lyonix
      POSTGRES_PASSWORD: lyonix_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
